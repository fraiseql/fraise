[workspace]
resolver = "2"
members = ["crates/fraise", "xtask"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Lionel Hamayon"]
repository = "https://github.com/fraiseql/fraise"
homepage = "https://fraiseql.dev"
readme = "README.md"
keywords = ["fraiseql", "postgresql", "graphql", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
# House methodology: deny all + pedantic + cargo, warn nursery.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Reason: transitive version skew in dependencies is outside our control;
# denying it would fail CI for upstream churn.
multiple_crate_versions = "allow"
